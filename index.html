<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Valentine 💝</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background: linear-gradient(to bottom right,#d703eb,#ff0000);
    font-family: 'Pacifico', cursive;
    overflow:hidden;
    text-align:center;
    color:white;
}

#sparklesCanvas{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

.container{
    position:absolute;
    background: linear-gradient(to bottom right,#d703ebaa,#ff0000aa);
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:5vw;
    border-radius:5vw;
    max-width:90vw;
    box-shadow:0 0.5vw 2vw rgba(0,0,0,0.3);
    z-index:10;
}

button{
    padding:1vw 3vw;
    border:none;
    border-radius:3vw;
    font-size:1.5vw;
    cursor:pointer;
    margin:1vw;
    transition:0.3s;
}

#yesBtn{
    background:#ff4d88;
    color:white;
}
#yesBtn:hover{ transform: scale(1.1); }

#noBtn{
    background:#ff6699;
    color:white;
    position:relative;
}

.hidden{ display:none; }

.heart{ position:absolute; font-size:3vw; animation: float 5s linear infinite; }

.heart-frame{
    width:20vw;
    height:20vw;
    background:red;
    position:absolute;
    transform:rotate(-45deg);
    animation: pop 4s ease-in-out infinite;
    z-index:10;
}

.heart-frame::before,
.heart-frame::after{
    content:"";
    width:20vw;
    height:20vw;
    background:red;
    border-radius:50%;
    position:absolute;
    z-index:1;
}

.heart-frame::before{ top:-10vw; left:0; }
.heart-frame::after{ left:10vw; top:0; }

.heart-frame img{
    width:16vw;
    height:16vw;
    border-radius:50%;
    position:absolute;
    top:2vw;
    left:2vw;
    object-fit:cover;
    transform:rotate(45deg);
    z-index:5;
}

@keyframes float{
    from{ transform:translateY(100vh) scale(0.8); opacity:1;}
    to{ transform:translateY(-10vh) scale(1); opacity:0;}
}

@keyframes pop{
    0%{opacity:0; transform:scale(0.5) rotate(-45deg);}
    50%{opacity:1; transform:scale(1.1) rotate(-45deg);}
    100%{opacity:0; transform:scale(0.5) rotate(-45deg);}
}

#typingText{ font-size:4vw; margin-top:2vw; line-height:1.5; }

textarea{
    width:80%;
    padding:1.5vw;
    border-radius:2vw;
    border:none;
    margin-top:2vw;
    font-size:3vw;
}

#music{
    display:none;
}

@media screen and (max-width:600px){
    .container{ padding:8vw; border-radius:8vw; }
    button{ font-size:5vw; padding:3vw 6vw; border-radius:6vw; }
    .heart{ font-size:8vw; }
    .heart-frame{ width:40vw; height:40vw; }
    .heart-frame::before, .heart-frame::after{ width:40vw; height:40vw; }
    .heart-frame::before{ top:-20vw; }
    .heart-frame::after{ left:20vw; }
    .heart-frame img{ width:35vw; height:35vw; top:2.5vw; left:2.5vw; }
    #typingText{ font-size:6vw; }
    textarea{ font-size:4vw; padding:3vw; border-radius:4vw; }
}
</style>
</head>
<body>

<canvas id="sparklesCanvas"></canvas>

<div class="container" id="startPage">
    <h1>Dear <span style="color:#fff700;">Dorcas</span> 💖</h1>
    <h2>Will you be my Valentine? 💝</h2>
    <button id="yesBtn">Yes 😍</button>
    <button id="noBtn">No 🙈</button>
</div>

<div id="lovePage" class="hidden">
    <h1 id="typingText"></h1>

    <div style="position:absolute; bottom:2vw; width:100%;">
        <h3>Will you be my lover? 💌</h3>
        <textarea id="feedback" placeholder="Write your sweet response here..."></textarea><br>
        <button onclick="sendWhatsApp()">Send 💚</button>
    </div>
</div>

<!-- Hidden Love Song -->
<video id="music" src="love.mp4"></video>

<script>

const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
    noBtn.style.position="absolute";
    noBtn.style.top=Math.random()*window.innerHeight+"px";
    noBtn.style.left=Math.random()*window.innerWidth+"px";
});

document.getElementById("yesBtn").onclick=function(){
    document.getElementById("startPage").classList.add("hidden");
    document.getElementById("lovePage").classList.remove("hidden");

    document.getElementById("music").play();
    startHearts();
    popImages();
    typeMessage();
};

const message = "Since the day we met, my world changed beautifully. 🌸 Every laugh, every moment made me fall for you deeper. You are my happiness, my peace, my sweetest blessing. I truly love you more than words can ever explain. 💖✨";

function typeMessage(){
    let i=0;
    function typing(){
        if(i<message.length){
            document.getElementById("typingText").innerHTML += message.charAt(i);
            i++;
            setTimeout(typing,50);
        }
    }
    typing();
}

function startHearts(){
    setInterval(()=>{
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💖";
        heart.style.top=(Math.random()*50 + 10)+"vh";
        heart.style.left=Math.random()*90+"vw";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    },300);
}

function popImages(){
    const imageFile = "photo2.jpeg";
    setInterval(()=>{
        let frame=document.createElement("div");
        frame.className="heart-frame";
        frame.style.top=(Math.random()*50 + 10)+"vh";
        frame.style.left=(Math.random()*80)+"vw";
        frame.innerHTML=`<img src="${imageFile}">`;
        document.body.appendChild(frame);
        setTimeout(()=>frame.remove(),4000);
    },2000);
}

function sendWhatsApp(){
    let text=document.getElementById("feedback").value;
    let phone="255750632401";
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`);
}

const canvas = document.getElementById('sparklesCanvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<100;i++){
    particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        r: Math.random()*2+1,
        alpha: Math.random(),
        dx: (Math.random()-0.5)*0.5,
        dy: (Math.random()-0.5)*0.5,
        color: ["#ff6699","#ff3366","#ff99cc","#ff66cc","#ff3366"][Math.floor(Math.random()*5)]
    });
}

function drawParticles(){
    ctx.clearRect(0,0,w,h);
    for(let i=0;i<particles.length;i++){
        let p = particles[i];
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(${parseInt(p.color.slice(1,3),16)},${parseInt(p.color.slice(3,5),16)},${parseInt(p.color.slice(5,7),16)},${p.alpha})`;
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if(p.x<0)p.x=w;
        if(p.x>w)p.x=0;
        if(p.y<0)p.y=h;
        if(p.y>h)p.y=0;
    }
    requestAnimationFrame(drawParticles);
}
drawParticles();

window.addEventListener('resize',()=>{
    w=canvas.width = window.innerWidth;
    h=canvas.height = window.innerHeight;
});

</script>

</body>
</html>
